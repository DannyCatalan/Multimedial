<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Multimedial</title>

<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: white;
    color: black;
    font-family: "Courier New", monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
  }

  .titulo {
    text-align: center;
  }

  /* "Marica" con subrayado negro y enlace al manifiesto */
  .marica {
    color: black;
    text-decoration: underline;
    text-decoration-color: black;
    text-underline-offset: 6px;
  }

  .marica:hover {
    opacity: 0.6;
  }

  /* Menú debajo del título */
  .menu-principal {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-top: 20px;
  }

  .menu-principal a {
    font-size: 20px;
    letter-spacing: 3px;
    color: #999;
    text-decoration: none;
  }

  .menu-principal a:hover {
    color: black;
  }

</style>

</head>

<body>

  <div class="titulo">

    Tráns-ito <a href="manifiesto.html" class="marica">Marica</a>

    <div class="menu-principal">
      <a href="obra.html">OBRA</a>
      <a href="contacto.html">CONTACTO</a>
    </div>

  </div>

</body>
</html>
