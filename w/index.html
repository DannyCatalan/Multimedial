<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Multimedial</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: white;
    color: black;
    font-family: "Courier New", monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 60px;
  }

  .titulo {
    text-align: center;
  }

  /* Estilo para tu nombre */
  .nombre-autor {
    font-size: 15px; /* Tamaño más pequeño que el título */
    letter-spacing: 5px;
    margin-top: 10px;
    text-transform: uppercase;
    color: #333;
  }

  .marica {
    color: black;
    text-decoration: underline;
    text-decoration-color: black;
    text-underline-offset: 6px;
  }

  .marica:hover {
    opacity: 0.6;
  }

  .menu-principal {
    display: flex;
    gap: 40px;
    justify-content: center;
    margin-top: 20px;
  }

  .menu-principal a {
    font-size: 20px;
    letter-spacing: 3px;
    color: #999;
    text-decoration: none;
  }

  .menu-principal a:hover {
    color: black;
  }
</style>
</head>

<body>

  <div class="titulo">
    <!-- Título Principal -->
    Tráns-ito <a href="manifiesto.html" class="marica">Marica</a>

    <!-- Tu nombre aparece aquí -->
    <div class="nombre-autor">Danny Catalán</div>

    <!-- Menú de navegación -->
    <div class="menu-principal">
      <a href="obra.html">OBRA</a>
      <a href="contacto.html">CONTACTO</a>
    </div>
  </div>

</body>
</html>
