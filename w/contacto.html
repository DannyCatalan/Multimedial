<style>

  }

  body {

    font-family: "Courier New", monospace;

  }

  /* MENÚ LATERAL IZQUIERDO */
  .menu {
    position: fixed;

    letter-spacing: 10px;
    margin-bottom: 60px;

  }

  .dato .etiqueta {
    font-size: 12px;
    letter-spacing: 3px;
    color: #999;
    margin-bottom: 8px;

  .dato .valor {

  }

  .dato a {

</head>
